<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="GDD-Forge — Brainstorm canvas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#13131f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="50" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700" fill="#e7e7ee" text-anchor="middle">BRAINSTORM CANVAS</text>
  <text x="600" y="78" font-family="ui-monospace,monospace" font-size="11" fill="#9a9ab0" letter-spacing="2" text-anchor="middle">NODES · CONNECTIONS · GROUPS</text>

  <!-- Canvas background -->
  <g transform="translate(80 110)">
    <rect width="1040" height="500" rx="12" fill="#0e0e16" stroke="rgba(255,255,255,0.06)"/>
    <pattern id="dotgrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <rect width="1040" height="500" fill="url(#dotgrid)"/>
  </g>

  <!-- Connections -->
  <g stroke="rgba(124,92,255,0.4)" stroke-width="1.5" fill="none">
    <path d="M 200 220 Q 290 200 360 280"/>
    <path d="M 360 280 Q 460 360 560 300"/>
    <path d="M 560 300 Q 660 260 720 380"/>
    <path d="M 360 280 Q 380 380 480 460"/>
    <path d="M 480 460 Q 580 500 720 380"/>
    <path d="M 720 380 Q 820 400 880 500"/>
    <path d="M 200 220 Q 100 320 180 480"/>
  </g>

  <!-- Node 1: Boss mechanic -->
  <g transform="translate(140 180)">
    <rect width="120" height="80" rx="10" fill="rgba(124,92,255,0.25)" stroke="rgba(124,92,255,0.7)"/>
    <text x="60" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Boss mechanic</text>
    <text x="60" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">Phase 2 = clone</text>
    <text x="60" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">player movement</text>
  </g>

  <!-- Node 2: Dash -->
  <g transform="translate(320 240)">
    <rect width="100" height="80" rx="10" fill="rgba(255,138,76,0.25)" stroke="rgba(255,138,76,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Dash cancel</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">frame-perfect</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">movement</text>
  </g>

  <!-- Node 3: Combo system -->
  <g transform="translate(520 260)">
    <rect width="100" height="80" rx="10" fill="rgba(124,92,255,0.25)" stroke="rgba(124,92,255,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Combo system</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">3-hit buffer</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">+ damage ramp</text>
  </g>

  <!-- Node 4: Parry -->
  <g transform="translate(680 340)">
    <rect width="100" height="80" rx="10" fill="rgba(255,138,76,0.25)" stroke="rgba(255,138,76,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Parry window</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">6 frames</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">→ slow-mo</text>
  </g>

  <!-- Node 5: Risk/reward -->
  <g transform="translate(440 420)">
    <rect width="100" height="80" rx="10" fill="rgba(124,92,255,0.25)" stroke="rgba(124,92,255,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Risk/reward</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">greedy parry =</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">HP loss</text>
  </g>

  <!-- Node 6: Run modifier -->
  <g transform="translate(840 460)">
    <rect width="100" height="80" rx="10" fill="rgba(255,138,76,0.25)" stroke="rgba(255,138,76,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Run modifier</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">boss clones</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">from killed</text>
  </g>

  <!-- Node 7: Lore seed -->
  <g transform="translate(140 440)">
    <rect width="100" height="80" rx="10" fill="rgba(61,220,151,0.25)" stroke="rgba(61,220,151,0.7)"/>
    <text x="50" y="28" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" fill="#e7e7ee" text-anchor="middle">Lore seed</text>
    <text x="50" y="48" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">echoes of</text>
    <text x="50" y="64" font-family="ui-sans-serif,system-ui" font-size="10" fill="#9a9ab0" text-anchor="middle">past runs</text>
  </g>

  <!-- Toolbar -->
  <g transform="translate(80 640)">
    <rect width="1040" height="50" rx="10" fill="#13131f" stroke="rgba(255,255,255,0.08)"/>
    <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#9a9ab0">
      <rect x="14" y="14" width="80" height="22" rx="6" fill="rgba(124,92,255,0.15)" stroke="rgba(124,92,255,0.4)"/>
      <text x="54" y="29" fill="#a48bff" text-anchor="middle">+ Node</text>

      <rect x="104" y="14" width="80" height="22" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="144" y="29" text-anchor="middle">+ Group</text>

      <rect x="194" y="14" width="80" height="22" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="234" y="29" text-anchor="middle">Connect</text>

      <text x="990" y="29" text-anchor="end" font-family="ui-monospace,monospace" font-size="10">7 nodes · 7 connections</text>
    </g>
  </g>
</svg>
