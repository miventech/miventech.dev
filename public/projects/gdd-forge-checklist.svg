<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="GDD-Forge — Checklist view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#13131f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Title bar -->
  <text x="600" y="60" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700" fill="#e7e7ee" text-anchor="middle">CHECKLIST · TASK GROUPS</text>
  <text x="600" y="88" font-family="ui-monospace,monospace" font-size="11" fill="#9a9ab0" letter-spacing="2" text-anchor="middle">GDD FORGE</text>

  <!-- Group 1: Pre-production -->
  <g transform="translate(140 130)">
    <rect width="430" height="260" rx="10" fill="#13131f" stroke="rgba(255,255,255,0.08)"/>
    <rect width="430" height="40" rx="10" fill="rgba(124,92,255,0.18)"/>
    <circle cx="22" cy="20" r="6" fill="#a48bff"/>
    <text x="42" y="25" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600" fill="#e7e7ee">PRE-PRODUCTION</text>
    <text x="400" y="25" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ab0" text-anchor="end">4/6</text>

    <g transform="translate(20 60)">
      <rect width="16" height="16" rx="3" fill="url(#acc)"/>
      <path d="M4 8 L7 11 L13 4" stroke="#0a0a0f" stroke-width="2" fill="none"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#6b6b80" text-decoration="line-through">Concept document</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(124,92,255,0.3)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#a48bff" text-anchor="middle">DONE</text>
    </g>
    <g transform="translate(20 92)">
      <rect width="16" height="16" rx="3" fill="url(#acc)"/>
      <path d="M4 8 L7 11 L13 4" stroke="#0a0a0f" stroke-width="2" fill="none"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#6b6b80" text-decoration="line-through">Art bible v1</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(124,92,255,0.3)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#a48bff" text-anchor="middle">DONE</text>
    </g>
    <g transform="translate(20 124)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Core loop prototype</text>
      <rect x="320" y="2" width="70" height="14" rx="3" fill="rgba(255,138,76,0.3)"/>
      <text x="355" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#ff8a4c" text-anchor="middle">IN PROGRESS</text>
    </g>
    <g transform="translate(20 156)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Pitch deck</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#9a9ab0" text-anchor="middle">LOW</text>
    </g>
    <g transform="translate(20 188)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Vertical slice scope</text>
      <rect x="320" y="2" width="70" height="14" rx="3" fill="rgba(255,0,0,0.2)"/>
      <text x="355" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#ff6b6b" text-anchor="middle">BLOCKED</text>
    </g>
    <g transform="translate(20 220)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="2 2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#6b6b80">+ Add task</text>
    </g>
  </g>

  <!-- Group 2: Gameplay -->
  <g transform="translate(630 130)">
    <rect width="430" height="260" rx="10" fill="#13131f" stroke="rgba(255,255,255,0.08)"/>
    <rect width="430" height="40" rx="10" fill="rgba(255,138,76,0.18)"/>
    <circle cx="22" cy="20" r="6" fill="#ff8a4c"/>
    <text x="42" y="25" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600" fill="#e7e7ee">GAMEPLAY</text>
    <text x="400" y="25" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ab0" text-anchor="end">1/5</text>

    <g transform="translate(20 60)">
      <rect width="16" height="16" rx="3" fill="url(#acc)"/>
      <path d="M4 8 L7 11 L13 4" stroke="#0a0a0f" stroke-width="2" fill="none"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#6b6b80" text-decoration="line-through">Player controller</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(124,92,255,0.3)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#a48bff" text-anchor="middle">DONE</text>
    </g>
    <g transform="translate(20 92)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Enemy AI states</text>
      <rect x="320" y="2" width="70" height="14" rx="3" fill="rgba(255,138,76,0.3)"/>
      <text x="355" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#ff8a4c" text-anchor="middle">IN PROGRESS</text>
    </g>
    <g transform="translate(20 124)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Boss patterns × 3</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#9a9ab0" text-anchor="middle">MED</text>
    </g>
    <g transform="translate(20 156)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Run-end flow</text>
      <rect x="350" y="2" width="40" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
      <text x="370" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#9a9ab0" text-anchor="middle">LOW</text>
    </g>
    <g transform="translate(20 188)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(124,92,255,0.6)" stroke-width="2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#e7e7ee">Meta progression</text>
      <rect x="320" y="2" width="70" height="14" rx="3" fill="rgba(255,0,0,0.2)"/>
      <text x="355" y="12" font-family="ui-monospace,monospace" font-size="9" fill="#ff6b6b" text-anchor="middle">BLOCKED</text>
    </g>
    <g transform="translate(20 220)">
      <rect width="16" height="16" rx="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="2 2"/>
      <text x="32" y="13" font-family="ui-sans-serif,system-ui" font-size="13" fill="#6b6b80">+ Add task</text>
    </g>
  </g>

  <!-- Stats footer -->
  <g transform="translate(140 430)">
    <rect width="920" height="120" rx="10" fill="#13131f" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="32" font-family="ui-monospace,monospace" font-size="11" fill="#9a9ab0" letter-spacing="2">PROGRESS</text>

    <g transform="translate(24 56)">
      <text x="0" y="0" font-family="ui-sans-serif,system-ui" font-size="11" fill="#9a9ab0">DONE</text>
      <text x="0" y="28" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" fill="#3ddc97">5</text>
    </g>
    <g transform="translate(180 56)">
      <text x="0" y="0" font-family="ui-sans-serif,system-ui" font-size="11" fill="#9a9ab0">IN PROGRESS</text>
      <text x="0" y="28" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" fill="#ff8a4c">2</text>
    </g>
    <g transform="translate(380 56)">
      <text x="0" y="0" font-family="ui-sans-serif,system-ui" font-size="11" fill="#9a9ab0">BLOCKED</text>
      <text x="0" y="28" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" fill="#ff6b6b">2</text>
    </g>
    <g transform="translate(560 56)">
      <text x="0" y="0" font-family="ui-sans-serif,system-ui" font-size="11" fill="#9a9ab0">REMAINING</text>
      <text x="0" y="28" font-family="ui-sans-serif,system-ui" font-size="28" font-weight="700" fill="#e7e7ee">2</text>
    </g>

    <rect x="24" y="98" width="872" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="24" y="98" width="490" height="6" rx="3" fill="url(#acc)"/>
  </g>

  <g transform="translate(600 660)" font-family="ui-sans-serif,system-ui" text-anchor="middle">
    <text font-size="32" font-weight="700" fill="#e7e7ee">GDD-Forge · Checklist</text>
    <text y="32" font-size="14" fill="#9a9ab0">Task groups · Priorities · Status · Drag to reorder</text>
  </g>
</svg>
