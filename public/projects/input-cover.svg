<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Editable Runtime Input System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#13131f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g transform="translate(600 380)" font-family="ui-monospace,monospace" text-anchor="middle">
    <g>
      <rect x="-260" y="-100" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2"/>
      <text x="-200" y="-62" font-size="16" fill="#e7e7ee">Jump</text>
      <text x="-200" y="-44" font-size="10" fill="#9a9ab0">[ Space ]</text>
    </g>
    <g>
      <rect x="-60" y="-100" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2"/>
      <text y="-62" font-size="16" fill="#e7e7ee">Attack</text>
      <text y="-44" font-size="10" fill="#9a9ab0">[ Mouse0 ]</text>
    </g>
    <g>
      <rect x="140" y="-100" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2"/>
      <text x="200" y="-62" font-size="16" fill="#e7e7ee">Dash</text>
      <text x="200" y="-44" font-size="10" fill="#9a9ab0">[ LShift ]</text>
    </g>
    <g>
      <rect x="-260" y="20" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.5"/>
      <text x="-200" y="58" font-size="16" fill="#9a9ab0">Pause</text>
      <text x="-200" y="76" font-size="10" fill="#6b6b80">[ Esc ]</text>
    </g>
    <g>
      <rect x="-60" y="20" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.5"/>
      <text y="58" font-size="16" fill="#9a9ab0">Inventory</text>
      <text y="76" font-size="10" fill="#6b6b80">[ Tab ]</text>
    </g>
    <g>
      <rect x="140" y="20" width="120" height="60" rx="10" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0.5"/>
      <text x="200" y="58" font-size="16" fill="#9a9ab0">Map</text>
      <text x="200" y="76" font-size="10" fill="#6b6b80">[ M ]</text>
    </g>
  </g>
  <g transform="translate(600 660)" font-family="ui-sans-serif,system-ui" text-anchor="middle">
    <text font-size="32" font-weight="600" fill="#e7e7ee">Editable Runtime Input</text>
    <text y="36" font-size="16" fill="#9a9ab0">Rebindable · Persistent · Player-first</text>
  </g>
</svg>
